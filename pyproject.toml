[project]
name = "lapinou"
version = "0.1.0"
description = "An agentic game engine"
license = "AGPL-3.0-only"
readme = "README.md"
authors = [
    { name = "Jonathan Tremesaygues", email = "jonathan.tremesaygues@slaanesh.org" },
]
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.13.4",
    "pydantic-ai-slim[google,openai]>=2.25.0",
    "pygame-ce>=2.5.7",
    "python-dotenv>=1.2.2",
]

[project.scripts]
lapinou = "lapinou.main:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"
